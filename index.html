<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bay Café</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #071820;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .wave-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(4, 23, 31, 0.08),
        rgba(4, 23, 31, 0.18)
      );
    }

    .title {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      white-space: nowrap;

      font-size: clamp(42px, 7vw, 90px);
      font-weight: 800;
      letter-spacing: 10px;

      color: #9b6b2d;

      text-shadow:
        1px 1px 0 #e7bd72,
        -2px -2px 0 rgba(80, 50, 20, 0.3);

      mix-blend-mode: multiply;

      opacity: 0;
      animation: reveal 1.2s ease forwards;
      animation-delay: 2.8s;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translate(-50%, 20px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <video
      class="wave-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source src="wave.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="title">
      BAY CAFÉ
    </div>

  </div>

</body>

</html>
