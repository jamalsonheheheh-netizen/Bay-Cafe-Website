<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bay Café</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061820;
}

.scene{
  position:relative;
  width:100%;
  height:100%;
}

#wave{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

video::-webkit-media-controls{
  display:none!important;
}

.title{
  position:absolute;
  left:50%;
  bottom:12%;
  transform:translate(-50%,20px);
  opacity:0;

  color:#8d5d25;
  font:800 clamp(42px,7vw,90px) Arial;
  letter-spacing:10px;
  white-space:nowrap;

  text-shadow:
    1px 1px #e4ba70,
    -2px -2px #56361755;

  mix-blend-mode:multiply;

  animation:show 1s ease forwards;
  animation-delay:3s;
}

@keyframes show{
  to{
    opacity:1;
    transform:translate(-50%,0);
  }
}
</style>
</head>

<body>

<div class="scene">

  <video
    id="wave"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    disablepictureinpicture
  >
    <source src="wave.mp4" type="video/mp4">
  </video>

  <div class="title">BAY CAFÉ</div>

</div>

<script>
const video=document.getElementById("wave");

video.muted=true;
video.volume=0;

function start(){
  video.play().catch(()=>{});
}

video.addEventListener("loadeddata",start);
video.addEventListener("canplay",start);

start();

document.addEventListener("click",start,{once:true});
document.addEventListener("touchstart",start,{once:true});
</script>

</body>
</html>
